[project]
name = "glosa-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.12",
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "anthropic>=0.70",
    "httpx>=0.27",
    "fastembed>=0.5",
    "wordfreq>=3.1",
    "cryptography>=43",
    "docker>=7.1",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "genanki>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
