# Publishes a glosa release: the app's images on ghcr.io and the Windows installer.
# Runs on a version tag (v0.1.0) or by hand. Uses only the workflow's own token: no
# personal secrets are involved, and none end up in an image or the installer.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  PREFIX: ghcr.io/cokefish/glosa

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: api
            file: api/Dockerfile
          - name: web
            context: web
            file: web/Dockerfile.release
          - name: tts-supertonic
            context: tts/supertonic
            file: tts/supertonic/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.PREFIX }}-${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  installer:
    runs-on: windows-latest
    needs: images
    steps:
      - uses: actions/checkout@v4
      - name: Version
        id: v
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+') { $v = "0.0.0-dev" }
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.v.outputs.version }}" installer\glosa.iss
      - uses: actions/upload-artifact@v4
        with:
          name: glosa-setup
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
