name: glosa

# Development setup: the API and web reload from the sources. The released app uses
# installer/compose.yaml with published images instead.
#
# API keys are read from the environment. Run with Doppler to inject them:
#   doppler run -- docker compose up -d
#
# Voices, translators and the offline dictionary are not services here: they are extras the
# app installs and removes itself (Extras page), through the Docker socket.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glosa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glosa}
      POSTGRES_DB: glosa
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glosa"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+psycopg://glosa:${POSTGRES_PASSWORD:-glosa}@db:5432/glosa
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      # Ollama on the host, used when the app has not installed its own.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Encrypts API keys entered in the app. Optional: without it a key is generated in api-data.
      GLOSA_SECRET_KEY: ${GLOSA_SECRET_KEY:-}
      # In development the Supertonic image is built locally (tts/supertonic).
      GLOSA_SUPERTONIC_IMAGE: glosa-tts-supertonic:latest
    volumes:
      - ./api/app:/app/app
      - ./api/tests:/app/tests
      - api-data:/data
      # Lets the app install and remove its extras (only containers labelled glosa.extra).
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach Ollama / LM Studio on the host
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    command: ["npm", "run", "dev"]
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    ports:
      - "5174:5173"
    depends_on:
      - api

volumes:
  db-data:
  api-data:
