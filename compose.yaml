name: glosa

# API keys are read from the environment. Run with Doppler to inject them:
#   doppler run -- docker compose up -d
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: glosa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-glosa}
      POSTGRES_DB: glosa
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glosa"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://glosa:${POSTGRES_PASSWORD:-glosa}@db:5432/glosa
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      TRANSLATOR_URL: http://translator:5000
      # Ollama on the host, for the local translation model (Ajustes → Traducción).
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      # Encrypts API keys entered in the app. Optional: without it a key is generated in api-data.
      GLOSA_SECRET_KEY: ${GLOSA_SECRET_KEY:-}
    volumes:
      - ./api/app:/app/app
      - ./api/tests:/app/tests
      - api-data:/data
    ports:
      - "8001:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"  # reach Ollama / LM Studio on the host
    depends_on:
      db:
        condition: service_healthy

  # Local machine translation (Argos Translate), no AI service or internet needed after the
  # first start downloads the models. Add language codes to LT_LOAD_ONLY to support more pairs.
  translator:
    image: libretranslate/libretranslate:latest
    environment:
      LT_LOAD_ONLY: en,es
    volumes:
      - translator-models:/home/libretranslate/.local

  # Local text-to-speech. Kokoro is the main voice; Supertonic covers the languages Kokoro
  # lacks (German, Russian, Korean…). No host ports: only the API talks to them.
  tts-kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest

  tts-supertonic:
    build: ./tts/supertonic
    volumes:
      - tts-supertonic-cache:/root/.cache

  web:
    build: ./web
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      - ./web/vite.config.ts:/app/vite.config.ts
    ports:
      - "5174:5173"
    depends_on:
      - api

volumes:
  db-data:
  translator-models:
  api-data:
  tts-supertonic-cache:
